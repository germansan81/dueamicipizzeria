:root{--cream:#F6F2D8;--red:#871816;--green:#08672F;--line:#D6CDAC;--rule:#B9AC85;--ink:#231F1A;--soft:#6A6152}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:58px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Texto','Century Gothic','Trebuchet MS',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
nav{position:sticky;top:0;z-index:10;background:rgba(246,242,216,.97);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:9px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{display:inline-block;font-family:'Item',sans-serif;font-weight:500;text-transform:uppercase;font-size:.8rem;letter-spacing:.8px;text-decoration:none;color:var(--ink);padding:6px 12px;margin-right:6px;border:1.5px solid var(--line);border-radius:16px}
nav a.on{background:var(--green);border-color:var(--green);color:var(--cream)}
.lang{position:absolute;top:calc(12px + 3%);right:9%;z-index:2;display:flex;border:1.5px solid var(--green);border-radius:14px;overflow:hidden}
.lang button{font-family:'Item',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:1px;padding:5px 10px;border:0;background:transparent;color:var(--green);cursor:pointer}
.lang button.on{background:var(--green);color:var(--cream)}

h2.en{font-family:'TituloEN',serif;font-weight:400;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:none;font-size:min(2rem,7.4vw);letter-spacing:0;line-height:1.05;margin:0 0 18px}
.en-t{display:inline-block;font-family:'TituloEN',serif;color:var(--red);letter-spacing:.08em;-webkit-text-stroke:.4px var(--red);text-align:left}
h2.en img{height:auto;flex:none;min-width:0}
.cover .sub .en-t{font-size:min(1.75rem,6.4vw);letter-spacing:.05em;white-space:nowrap}
.cover .sub .en-t i{font-style:normal;color:var(--green);-webkit-text-stroke:.4px var(--green)}
.promo h3 .en-t{font-size:1.35rem;letter-spacing:.04em}
h2.ti{display:block;text-align:center;margin:0 0 18px}
h2.ti img{display:inline-block;height:auto;max-width:100%}
.promo h3 img{width:100%;max-width:230px;height:auto;display:block}
h2{font-family:'Titulo',serif;font-weight:400;color:var(--red);text-transform:uppercase;letter-spacing:2px;line-height:.98;font-size:min(2.15rem,7.4vw);margin:0 0 18px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
h2.center{text-align:center}
h2 img{height:auto;flex:none;min-width:0}
h2.sm2{font-size:min(2.15rem,6.6vw)}
h2.sm{font-size:min(1.62rem,5.6vw);letter-spacing:1.2px}
h2 .t{flex:none}
.meta{font-size:.7rem;text-align:center;line-height:1.5;margin:-4px 0 12px;color:var(--ink)}
.meta b{font-family:'Item',sans-serif;font-weight:600}
.it{margin:0 0 14px}
.hd{display:flex;align-items:flex-end;gap:8px}
.nm{flex:1;font-family:'Item',sans-serif;font-weight:500;text-transform:uppercase;font-size:1.02rem;letter-spacing:.2px;line-height:1.15;border-bottom:1px solid var(--rule);padding-bottom:1px;display:flex;align-items:center;gap:6px}
.nm img{width:17px;height:auto}
.pr{font-family:'Item',sans-serif;font-weight:500;font-size:1rem;white-space:nowrap;transform:translateY(5px)}
.ds{font-size:.82rem;color:var(--soft);line-height:1.4;margin:5px 0 0;max-width:78%}
.grp{margin:4px 0 14px}
.gh{display:flex;justify-content:space-between;align-items:flex-end;font-family:'Item',sans-serif;font-weight:500;text-transform:uppercase;font-size:1.02rem}
.gh span{font-family:'Item',sans-serif;font-weight:400;font-size:.7rem;color:var(--soft);letter-spacing:1.5px}
.sb{display:flex;align-items:flex-end;gap:8px;margin-top:3px}
.sb .n{flex:1;font-size:.84rem;color:var(--soft);border-bottom:1px solid var(--rule);padding-bottom:1px}
.sb .pr{font-size:.95rem;transform:translateY(4px)}
.promo{position:relative;border:2px solid var(--red);margin:22px 2px 26px;padding:16px 14px 14px;display:flex;gap:12px;align-items:center}
.promo::before{content:"";position:absolute;inset:3px;border:1px solid var(--red);opacity:.35;pointer-events:none}
.promo img{width:19%;height:auto;flex:none}
.promo .sb .n{font-size:.78rem}
.promo .gh span{font-size:.62rem}
.promo .body{flex:1}
.promo h3{font-family:'Titulo',serif;font-weight:400;color:var(--red);font-size:1.35rem;margin:0 0 8px;line-height:1}
.promo .nm{font-size:.92rem}

    if (c.meta) h += '<p class="meta">' + c.meta[l] + '</p>';
    h += c.rows.map(r => row(r, l)).join('');
    if (c.note) h += '<p class="note">' + t.note + '</p>';
    h += '</div></section>';
  });
  h += '<p class="foot">' + t.foot + '<br><a href="/">' + t.site + '</a></p>';
  document.getElementById('main').innerHTML = h;
  watch();
}

function setLang(l){ lang = l; render(); }

let obs;
function watch(){
  if (obs) obs.disconnect();
  if (!('IntersectionObserver' in window)) return;
  obs = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const nav = document.getElementById('nav');
      nav.querySelectorAll('a').forEach(a => {
        const on = a.dataset.id === e.target.id;
        a.classList.toggle('on', on);
        if (on) nav.scrollLeft = a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2;
      });
    });
  }, {rootMargin:'-60px 0px -75% 0px'});
  document.querySelectorAll('main section').forEach(s => obs.observe(s));
}

render();
</script>
